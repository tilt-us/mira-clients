[workspace]
resolver = "3"
members = [
  "apps/mira-game-client",
  "apps/mira-game-server",
  "crates/game-shared",
  "crates/game-logic",
  "crates/game-world",
]
exclude = [
  "apps/mira-client/src-tauri",
  "apps/mira-installer/src-tauri",
]

[workspace.package]
edition = "2024"
authors = ["mira contributors"]
version = "0.1.0"

[workspace.dependencies]
avian3d = "0.7"
bevy = { version = "0.19", features = ["bevy_feathers", "jpeg"] }
bevy_transform_interpolation = "0.5"
lightyear = { version = "0.28", features = ["udp", "netcode"] }
polyanya = { version = "0.16.1", default-features = false }
polyanya-glam = { package = "glam", version = "0.30.10" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

game-shared = { path = "crates/game-shared" }
game-logic = { path = "crates/game-logic" }
game-world = { path = "crates/game-world" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
