name: Release

on:
  push:
    branches:
      - development
      - master
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PROD to publish production"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'push' && (github.ref_name == 'development' && 'mira-client-publish-dev' || github.ref_name == 'master' && 'mira-client-publish-staging' || 'mira-client-publish-invalid') || github.event_name == 'workflow_dispatch' && 'mira-client-publish-prod' || 'mira-client-publish-invalid' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  prepare:
    name: Resolve deployment environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      is_production: ${{ steps.resolve.outputs.is_production }}
      github_environment: ${{ steps.resolve.outputs.github_environment }}
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      head_sha: ${{ steps.metadata.outputs.head_sha }}
      notes: ${{ steps.metadata.outputs.notes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve deployment environment
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          resolution="$(node scripts/deployment-environment.mjs \
            --event "${EVENT_NAME}" \
            --branch "${REF_NAME}" \
            --confirm "${CONFIRM:-}")"
          environment="$(node -e 'console.log(JSON.parse(process.argv[1]).environment)' "${resolution}")"
          production="$(node -e 'console.log(JSON.parse(process.argv[1]).production)' "${resolution}")"
          {
            echo "environment=${environment}"
            echo "is_production=${production}"
            if [[ "${production}" == "true" ]]; then
              echo "github_environment=production"
            else
              echo "github_environment=${environment}"
            fi
          } >> "${GITHUB_OUTPUT}"

      - name: Calculate build metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          DEPLOYMENT_ENVIRONMENT: ${{ steps.resolve.outputs.environment }}
          IS_PRODUCTION: ${{ steps.resolve.outputs.is_production }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          head_sha="${HEAD_SHA}"
          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1 || true)"
          if [[ "${IS_PRODUCTION}" != "true" ]]; then
            version="${latest_tag#v}"
            version="${version:-0.0.0}"
            tag="${latest_tag:-v0.0.0}"
            {
              echo "version=${version}"
              echo "tag=${tag}"
              echo "head_sha=${head_sha}"
              echo "notes<<EOF"
              echo "Rolling ${DEPLOYMENT_ENVIRONMENT} build for ${head_sha}."
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          head_tag="$(git tag --points-at "${head_sha}" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1 || true)"
          if ! pr_title="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${REPOSITORY}/commits/${head_sha}/pulls" \
            --jq 'sort_by(.merged_at // .updated_at) | reverse | .[0].title // ""' \
            2>/dev/null)"; then
            pr_title=""
          fi
          if [[ -z "${pr_title}" ]]; then
            pr_title="$(git log -1 --format=%s "${head_sha}")"
          fi
          if [[ -n "${head_tag}" ]]; then
            version="${head_tag#v}"
            base_version="${version}"
          else
            base_version="${latest_tag#v}"
            if [[ -z "${base_version}" ]]; then
              version="1.0.0"
            else
              IFS=. read -r major minor patch <<< "${base_version}"
              case "${pr_title,,}" in
                feat*) minor=$((minor + 1)); patch=0 ;;
                fix*|chore*|doc*|ci*|ref*) patch=$((patch + 1)) ;;
                *) patch=$((patch + 1)) ;;
              esac
              version="${major}.${minor}.${patch}"
            fi
          fi
          tag="v${version}"

          if [[ -n "${latest_tag}" ]]; then
            log_range="${latest_tag}..${head_sha}"
            changes_title="Änderungen seit ${latest_tag}"
          else
            log_range="${head_sha}"
            changes_title="Änderungen"
          fi

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "${tag}")"
            if [[ "${tag_sha}" != "${head_sha}" ]]; then
              echo "Tag ${tag} exists on ${tag_sha}, not ${head_sha}."
              exit 1
            fi
          fi

          notes_file="$(mktemp)"
          {
            echo "## ${changes_title}"
            echo
            echo "Basisversion: ${base_version:-kein vorheriger Release}"
            echo "PR-Titel: ${pr_title}"
            echo
            echo "## Commits"
            git log --reverse --format='- `%h` %s - gepusht von %an' "${log_range}"
          } > "${notes_file}"

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "head_sha=${head_sha}"
            echo "notes<<EOF"
            cat "${notes_file}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  build-mira-game-client:
    name: Build mira-game-client (${{ matrix.label }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-15
            label: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Create mira-game-api access token
        id: mira-game-api-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.MIRA_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.MIRA_CI_APP_PRIVATE_KEY }}
          owner: tilt-us
          repositories: mira-game-api
          permission-contents: read

      - name: Configure Git access to mira-game-api
        shell: bash
        env:
          MIRA_GAME_API_TOKEN: ${{ steps.mira-game-api-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${MIRA_GAME_API_TOKEN}@github.com/".insteadOf \
            "ssh://git@github.com/"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgl1-mesa-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxi-dev \
            libxrandr-dev \
            pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Build
        env:
          MIRA_ENV: ${{ needs.prepare.outputs.environment }}
        run: cargo build --release --locked -p mira-game-client

      - name: Stage artifact
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          ext=""
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            ext=".exe"
          fi

          mkdir -p dist
          cp "target/release/mira-game-client${ext}" "dist/mira-game-client-${VERSION}-${LABEL}${ext}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mira-game-client-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  build-mira-client:
    name: Build mira-client (${{ matrix.label }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux
            bundles: deb,appimage,rpm
          - os: windows-latest
            label: windows
            bundles: nsis
          - os: macos-15
            label: macos
            bundles: dmg

    defaults:
      run:
        working-directory: apps/mira-client
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            libasound2-dev \
            libgl1-mesa-dev \
            libudev-dev \
            pkg-config

      - name: Verify Linux WebKitGTK version
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          version="$(pkg-config --modversion webkit2gtk-4.1)"
          echo "webkit2gtk-4.1 ${version}"
          if [[ "$(printf '%s\n' "2.52.0" "${version}" | sort -V | head -n 1)" != "2.52.0" ]]; then
            echo "WebKitGTK ${version} is too old for reliable AppImage EGL startup."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mira-client/package-lock.json

      - name: Setup npm
        run: npm install -g npm@11

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/mira-client/src-tauri -> apps/mira-client/src-tauri/target

      - name: Install dependencies
        run: npm ci

      - name: Apply release version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const version = process.env.VERSION;

          function writeJson(path, update) {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            update(data);
            fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
          }

          writeJson('package.json', data => {
            data.version = version;
          });

          writeJson('package-lock.json', data => {
            data.version = version;
            if (data.packages?.['']) {
              data.packages[''].version = version;
            }
          });

          writeJson('src-tauri/tauri.conf.json', data => {
            data.version = version;
          });

          const cargoPath = 'src-tauri/Cargo.toml';
          const cargo = fs.readFileSync(cargoPath, 'utf8')
            .replace(/^version = ".*"$/m, `version = "${version}"`);
          fs.writeFileSync(cargoPath, cargo);
          NODE

      - name: Prepare macOS signing env
        if: runner.os == 'macOS'
        env:
          ENABLE_APPLE_SIGNING: ${{ vars.ENABLE_APPLE_SIGNING }}
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [[ "${ENABLE_APPLE_SIGNING:-false}" != "true" ]]; then
            echo "Unsigned macOS build; set repository variable ENABLE_APPLE_SIGNING=true to enable signing."
            exit 0
          fi

          missing=()
          for key in APPLE_CERTIFICATE_SECRET APPLE_CERTIFICATE_PASSWORD_SECRET APPLE_ID_SECRET APPLE_PASSWORD_SECRET APPLE_TEAM_ID_SECRET; do
            if [[ -z "${!key:-}" ]]; then
              missing+=("${key}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'macOS signing is enabled, but a required signing secret is missing: %s\n' "${missing[@]}"
            exit 1
          fi

          cert_file="$(mktemp)"
          trap 'rm -f "${cert_file}"' EXIT

          if ! CERT_FILE="${cert_file}" python3 - <<'PY'
          import base64
          import os
          import sys

          try:
              cert = base64.b64decode(os.environ["APPLE_CERTIFICATE_SECRET"], validate=True)
          except Exception:
              sys.exit(1)

          with open(os.environ["CERT_FILE"], "wb") as file:
              file.write(cert)
          PY
          then
            echo "APPLE_CERTIFICATE is not valid one-line base64. Recreate it with: openssl base64 -A -in DeveloperIDApplication.p12 -out certificate-base64.txt"
            exit 1
          fi

          if ! openssl pkcs12 -in "${cert_file}" -passin "pass:${APPLE_CERTIFICATE_PASSWORD_SECRET}" -nokeys -info -noout >/dev/null 2>&1; then
            echo "APPLE_CERTIFICATE could not be opened as a .p12 with APPLE_CERTIFICATE_PASSWORD."
            exit 1
          fi

          {
            echo "APPLE_CERTIFICATE=${APPLE_CERTIFICATE_SECRET}"
            echo "APPLE_CERTIFICATE_PASSWORD=${APPLE_CERTIFICATE_PASSWORD_SECRET}"
            echo "APPLE_ID=${APPLE_ID_SECRET}"
            echo "APPLE_PASSWORD=${APPLE_PASSWORD_SECRET}"
            echo "APPLE_TEAM_ID=${APPLE_TEAM_ID_SECRET}"
            if [[ -n "${APPLE_SIGNING_IDENTITY_SECRET:-}" ]]; then
              echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY_SECRET}"
            fi
          } >> "${GITHUB_ENV}"

          echo "Apple signing enabled; Tauri will sign and notarize the DMG."

      - name: Build
        env:
          BUNDLES: ${{ matrix.bundles }}
          MIRA_ENV: ${{ needs.prepare.outputs.environment }}
          TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: ${{ runner.os == 'Linux' && 'true' || 'false' }}
          NO_STRIP: ${{ runner.os == 'Linux' && '1' || '' }}
        run: npm run tauri -- build --bundles "${BUNDLES}" --ci

      - name: Patch Linux AppImage environment
        if: runner.os == 'Linux'
        run: bash ../../scripts/patch-tauri-appimage-env.sh src-tauri/target/release/bundle/appimage

      - name: Stage artifact
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir -p dist
          while IFS= read -r -d '' asset; do
            name="$(basename "${asset}" | tr ' ' '-')"
            cp "${asset}" "dist/mira-client-${VERSION}-${LABEL}-${name}"
          done < <(find src-tauri/target/release/bundle -type f \
            \( -name '*.deb' \
            -o -name '*.AppImage' \
            -o -name '*.rpm' \
            -o -name '*.exe' \
            -o -name '*.dmg' \) \
            -print0)

          if [[ -z "$(find dist -type f -print -quit)" ]]; then
            echo "No mira-client release bundles found."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mira-client-${{ matrix.label }}
          path: apps/mira-client/dist/*
          if-no-files-found: error

  build-mira-installer:
    name: Build mira-installer (${{ matrix.label }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux
            bundles: deb,appimage,rpm
          - os: windows-latest
            label: windows
            bundles: nsis
          - os: macos-15
            label: macos
            bundles: dmg

    defaults:
      run:
        working-directory: apps/mira-installer
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            pkg-config

      - name: Verify Linux WebKitGTK version
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          version="$(pkg-config --modversion webkit2gtk-4.1)"
          echo "webkit2gtk-4.1 ${version}"
          if [[ "$(printf '%s\n' "2.52.0" "${version}" | sort -V | head -n 1)" != "2.52.0" ]]; then
            echo "WebKitGTK ${version} is too old for reliable AppImage EGL startup."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mira-installer/package-lock.json

      - name: Setup npm
        run: npm install -g npm@11

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/mira-installer/src-tauri -> apps/mira-installer/src-tauri/target

      - name: Install dependencies
        run: npm ci

      - name: Apply release version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const version = process.env.VERSION;

          function writeJson(path, update) {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            update(data);
            fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
          }

          writeJson('package.json', data => {
            data.version = version;
          });

          writeJson('package-lock.json', data => {
            data.version = version;
            if (data.packages?.['']) {
              data.packages[''].version = version;
            }
          });

          writeJson('src-tauri/tauri.conf.json', data => {
            data.version = version;
          });

          const cargoPath = 'src-tauri/Cargo.toml';
          const cargo = fs.readFileSync(cargoPath, 'utf8')
            .replace(/^version = ".*"$/m, `version = "${version}"`);
          fs.writeFileSync(cargoPath, cargo);
          NODE

      - name: Prepare macOS signing env
        if: runner.os == 'macOS'
        env:
          ENABLE_APPLE_SIGNING: ${{ vars.ENABLE_APPLE_SIGNING }}
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [[ "${ENABLE_APPLE_SIGNING:-false}" != "true" ]]; then
            echo "Unsigned macOS build; set repository variable ENABLE_APPLE_SIGNING=true to enable signing."
            exit 0
          fi

          missing=()
          for key in APPLE_CERTIFICATE_SECRET APPLE_CERTIFICATE_PASSWORD_SECRET APPLE_ID_SECRET APPLE_PASSWORD_SECRET APPLE_TEAM_ID_SECRET; do
            if [[ -z "${!key:-}" ]]; then
              missing+=("${key}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'macOS signing is enabled, but a required signing secret is missing: %s\n' "${missing[@]}"
            exit 1
          fi

          cert_file="$(mktemp)"
          trap 'rm -f "${cert_file}"' EXIT

          if ! CERT_FILE="${cert_file}" python3 - <<'PY'
          import base64
          import os
          import sys

          try:
              cert = base64.b64decode(os.environ["APPLE_CERTIFICATE_SECRET"], validate=True)
          except Exception:
              sys.exit(1)

          with open(os.environ["CERT_FILE"], "wb") as file:
              file.write(cert)
          PY
          then
            echo "APPLE_CERTIFICATE is not valid one-line base64. Recreate it with: openssl base64 -A -in DeveloperIDApplication.p12 -out certificate-base64.txt"
            exit 1
          fi

          if ! openssl pkcs12 -in "${cert_file}" -passin "pass:${APPLE_CERTIFICATE_PASSWORD_SECRET}" -nokeys -info -noout >/dev/null 2>&1; then
            echo "APPLE_CERTIFICATE could not be opened as a .p12 with APPLE_CERTIFICATE_PASSWORD."
            exit 1
          fi

          {
            echo "APPLE_CERTIFICATE=${APPLE_CERTIFICATE_SECRET}"
            echo "APPLE_CERTIFICATE_PASSWORD=${APPLE_CERTIFICATE_PASSWORD_SECRET}"
            echo "APPLE_ID=${APPLE_ID_SECRET}"
            echo "APPLE_PASSWORD=${APPLE_PASSWORD_SECRET}"
            echo "APPLE_TEAM_ID=${APPLE_TEAM_ID_SECRET}"
            if [[ -n "${APPLE_SIGNING_IDENTITY_SECRET:-}" ]]; then
              echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY_SECRET}"
            fi
          } >> "${GITHUB_ENV}"

          echo "Apple signing enabled; Tauri will sign and notarize the DMG."

      - name: Build
        env:
          BUNDLES: ${{ matrix.bundles }}
          MIRA_ENV: ${{ needs.prepare.outputs.environment }}
          TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: ${{ runner.os == 'Linux' && 'true' || 'false' }}
          NO_STRIP: ${{ runner.os == 'Linux' && '1' || '' }}
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            npm run tauri -- build --no-bundle --ci
          else
            npm run tauri -- build --bundles "${BUNDLES}" --ci
          fi

      - name: Patch Linux AppImage environment
        if: runner.os == 'Linux'
        run: bash ../../scripts/patch-tauri-appimage-env.sh src-tauri/target/release/bundle/appimage

      - name: Stage artifact
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir -p dist
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            cp src-tauri/target/release/mira-installer.exe \
              "dist/mira-installer-${VERSION}-${LABEL}-mira-installer.exe"
          else
            while IFS= read -r -d '' asset; do
              name="$(basename "${asset}" | tr ' ' '-')"
              cp "${asset}" "dist/mira-installer-${VERSION}-${LABEL}-${name}"
            done < <(find src-tauri/target/release/bundle -type f \
              \( -name '*.deb' \
              -o -name '*.AppImage' \
              -o -name '*.rpm' \
              -o -name '*.dmg' \) \
              -print0)
          fi

          if [[ -z "$(find dist -type f -print -quit)" ]]; then
            echo "No mira-installer release bundles found."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mira-installer-${{ matrix.label }}
          path: apps/mira-installer/dist/*
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub release
    needs:
      - prepare
      - build-mira-game-client
      - build-mira-client
      - build-mira-installer
    if: needs.prepare.outputs.is_production == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          NOTES: ${{ needs.prepare.outputs.notes }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          printf '%s\n' "${NOTES}" > release-notes.md

          mkdir -p publish-assets
          while IFS= read -r -d '' asset; do
            artifact_group="${asset#release-artifacts/}"
            artifact_group="${artifact_group%%/*}"
            name="$(basename "${asset}" | tr ' ' '-')"

            case "${artifact_group}" in
              mira-client-*)
                case "${name}" in
                  *.deb|*.AppImage|*.exe|*.dmg|*.rpm) ;;
                  *) continue ;;
                esac
                ;;
              mira-game-client-*)
                case "${name}" in
                  mira-game-client*) ;;
                  *) continue ;;
                esac
                ;;
              mira-installer-*)
                case "${name}" in
                  *.deb|*.AppImage|*.exe|*.dmg|*.rpm) ;;
                  *) continue ;;
                esac
                ;;
              *)
                continue
                ;;
            esac

            target="publish-assets/${name}"
            if [[ -e "${target}" ]]; then
              target="publish-assets/${artifact_group}-${name}"
            fi

            counter=1
            while [[ -e "${target}" ]]; do
              target="publish-assets/${counter}-${artifact_group}-${name}"
              counter=$((counter + 1))
            done

            cp "${asset}" "${target}"
          done < <(find release-artifacts -type f -print0)

          mapfile -d '' files < <(find publish-assets -type f -print0 | sort -z)

          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No release assets found."
            exit 1
          fi

          if gh release view "${TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --repo "${REPOSITORY}" \
              --target "${HEAD_SHA}" \
              --title "${TAG}" \
              --notes-file release-notes.md
          else
            gh release create "${TAG}" \
              --repo "${REPOSITORY}" \
              --target "${HEAD_SHA}" \
              --title "${TAG}" \
              --notes-file release-notes.md
          fi

          release_id="$(gh api "/repos/${REPOSITORY}/releases/tags/${TAG}" --jq '.id')"
          for asset_id in $(gh api --paginate "/repos/${REPOSITORY}/releases/${release_id}/assets" --jq '.[].id'); do
            gh api -X DELETE "/repos/${REPOSITORY}/releases/assets/${asset_id}" >/dev/null
          done

          gh release upload "${TAG}" "${files[@]}" \
            --repo "${REPOSITORY}" \
            --clobber

  publish-garage:
    name: Publish current Garage downloads
    needs:
      - prepare
      - build-mira-game-client
      - build-mira-client
      - build-mira-installer
    runs-on: mira-clients-publisher
    environment: ${{ needs.prepare.outputs.github_environment }}

    steps:
      - name: Checkout content source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python for AWS CLI
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AWS CLI
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir awscli
          aws --version

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare content archive
        run: |
          set -euo pipefail
          mkdir -p garage-content
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          source = Path("assets")
          destination = Path("garage-content/assets.zip")
          with ZipFile(destination, "w", compression=ZIP_DEFLATED, allowZip64=True) as archive:
              for path in source.rglob("*"):
                  if path.is_file():
                      archive.write(path, path.as_posix())
          PY

      - name: Prepare current download manifests
        env:
          MIRA_ENV: ${{ needs.prepare.outputs.environment }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
        run: |
          set -euo pipefail
          node scripts/garage-publish.mjs prepare \
            --environment "${MIRA_ENV}" \
            --artifacts release-artifacts \
            --content garage-content/assets.zip \
            --output garage-publish \
            --commit "${HEAD_SHA}" \
            --tag "${TAG}" \
            --version "${VERSION}"

      - name: Upload current Garage downloads
        env:
          GARAGE_ENDPOINT: ${{ secrets.GARAGE_ENDPOINT }}
          GARAGE_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
          GARAGE_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_ACCESS_KEY }}
          GARAGE_REGION: ${{ secrets.GARAGE_REGION }}
          GARAGE_BUCKET: ${{ secrets.GARAGE_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.GARAGE_REGION }}
          AWS_EC2_METADATA_DISABLED: true
        run: |
          set -euo pipefail
          : "${GARAGE_ENDPOINT:?GARAGE_ENDPOINT must be configured}"
          : "${GARAGE_ACCESS_KEY_ID:?GARAGE_ACCESS_KEY_ID must be configured}"
          : "${GARAGE_SECRET_ACCESS_KEY:?GARAGE_SECRET_ACCESS_KEY must be configured}"
          : "${GARAGE_REGION:?GARAGE_REGION must be configured}"
          : "${GARAGE_BUCKET:?GARAGE_BUCKET must be configured}"
          aws --version
          node scripts/garage-publish.mjs upload --plan garage-publish/upload-plan.json
